<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="i18n.js" defer></script>
  <title>Build a Robot</title>
  <link rel="icon" href="astars-logo.png" type="image/png" />
  <style>
    :root {
      --bg: #f3efe6;
      --card: #fffcf7;
      --ink: #3d3a34;
      --muted: #7a7468;
      --accent: #5a7d6a;
      --accent-soft: #d5e4db;
      --warm-soft: #f0e6d4;
      --star: #d4a84b;
      --brick-red: #c4786a;
      --brick-blue: #6d8fb8;
      --brick-yellow: #d4b56a;
      --brick-green: #6a9a7c;
      --brick-cream: #efe6d4;
      --shadow: 0 14px 40px rgba(61, 58, 52, 0.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top left, #efe8d8 0%, transparent 50%),
        radial-gradient(ellipse at bottom right, #dde8e2 0%, transparent 45%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }
    .playfield { position: relative; width: min(1120px, 100%); z-index: 1; }
    .brick-scape { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .float-brick {
      position: absolute; border-radius: 10px; opacity: 0.45;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.28), inset 0 -4px 0 rgba(0,0,0,0.08), 0 8px 18px rgba(61,58,52,0.1);
    }
    .float-brick::before {
      content: "";
      position: absolute; left: 50%; top: -10px; transform: translateX(-50%);
      width: calc(100% - 16px); height: 14px;
      background:
        radial-gradient(circle at 20% 50%, currentColor 0 5px, transparent 6px),
        radial-gradient(circle at 50% 50%, currentColor 0 5px, transparent 6px),
        radial-gradient(circle at 80% 50%, currentColor 0 5px, transparent 6px);
      opacity: 0.85;
    }
    .float-brick.b1 { width: 88px; height: 36px; background: var(--brick-red); color: #d99286; top: 8%; left: 4%; transform: rotate(-8deg); animation: bob 7s ease-in-out infinite; }
    .float-brick.b2 { width: 110px; height: 40px; background: var(--brick-blue); color: #8eafd0; top: 18%; right: 5%; transform: rotate(6deg); animation: bob 8s ease-in-out infinite 0.6s; }
    .float-brick.b3 { width: 72px; height: 32px; background: var(--brick-yellow); color: #e2c787; bottom: 16%; left: 7%; transform: rotate(10deg); animation: bob 6.5s ease-in-out infinite 1s; }
    .float-brick.b4 { width: 96px; height: 38px; background: var(--brick-green); color: #88b498; bottom: 10%; right: 8%; transform: rotate(-5deg); animation: bob 7.5s ease-in-out infinite 0.3s; }
    @keyframes bob {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -10px; }
    }
    .app {
      width: 100%;
      min-height: min(920px, calc(100vh - 40px));
      background: linear-gradient(180deg, #fffef9 0%, var(--card) 40%, #faf6ee 100%);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 44px 32px 28px;
      display: grid;
      gap: 16px;
      align-content: start;
      position: relative;
      border: 4px solid #e4dccb;
    }
    .app::before {
      content: "";
      position: absolute; top: -18px; left: 28px; right: 28px; height: 22px;
      background: radial-gradient(circle, var(--brick-cream) 0 9px, transparent 10px) 0 0 / 36px 22px repeat-x;
    }
    .brick-rail { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: -6px 0 2px; }
    .mini-brick {
      height: 18px; border-radius: 5px; position: relative;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 0 rgba(0,0,0,0.08);
    }
    .mini-brick::before {
      content: "";
      position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
      width: 8px; height: 8px; border-radius: 50%; background: inherit; filter: brightness(1.08);
    }
    .mini-brick.w2 { width: 34px; } .mini-brick.w3 { width: 48px; } .mini-brick.w4 { width: 62px; }
    .mini-brick.red { background: var(--brick-red); }
    .mini-brick.blue { background: var(--brick-blue); }
    .mini-brick.yellow { background: var(--brick-yellow); }
    .mini-brick.green { background: var(--brick-green); }
    .mini-brick.purple { background: #b59bc4; }
    .mini-brick.orange { background: #d4a07a; }

    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.2rem); color: var(--accent); }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; }
    .header-tools { display: flex; align-items: center; gap: 12px; }
    .home-btn, .sound-btn {
      border: none; border-radius: 14px; height: 56px; cursor: pointer;
      background: linear-gradient(180deg, #efe8da, #e4dccb);
      color: var(--ink); font: inherit; font-weight: 700; padding: 0 18px;
      text-decoration: none; display: inline-grid; place-items: center;
      box-shadow: 0 5px 0 #c9bfab;
    }
    .home-btn:active, .sound-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c9bfab; }
    .sound-btn { width: 56px; padding: 0; font-size: 1.35rem; }
    .scoreboard {
      background: var(--accent-soft); border-radius: 16px; padding: 10px 16px; text-align: center; min-width: 88px;
    }
    .scoreboard .label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .scoreboard .value { font-size: 1.35rem; font-weight: 800; color: var(--accent); }

    .progress { height: 10px; background: #efe8da; border-radius: 999px; overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--brick-yellow), var(--accent)); transition: width 0.35s ease; }

    .screen { display: none; }
    .screen.active { display: grid; gap: 16px; justify-items: center; }
    .rule-card {
      background: #fff; border: 3px solid #e4dccb; border-radius: 22px;
      padding: 28px 24px; text-align: center; max-width: 420px; width: 100%;
      box-shadow: var(--shadow);
    }
    .rule-caption { margin: 0; font-size: 1.15rem; line-height: 1.45; color: var(--ink); white-space: pre-line; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .primary {
      border: none; border-radius: 18px; min-height: 58px; padding: 0 28px;
      font: inherit; font-size: 1.2rem; font-weight: 800; cursor: pointer;
      background: linear-gradient(180deg, #6d917c, var(--accent));
      color: #fff; box-shadow: 0 7px 0 #3f5c49;
    }
    .primary:active { transform: translateY(4px); box-shadow: 0 3px 0 #3f5c49; }
    .primary:disabled { opacity: 0.55; cursor: default; transform: none; }

    .meta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%; }
    .level-pill {
      background: var(--warm-soft); color: #8a6a3a; font-weight: 800;
      border-radius: 999px; padding: 8px 14px; font-size: 0.95rem;
    }
    .die-pip {
      width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
      background: #fff; border: 3px solid #e4dccb; font-weight: 800; font-size: 1.2rem; color: var(--accent);
    }
    .steps-row { display: flex; gap: 6px; }
    .step-dot {
      width: 14px; height: 14px; border-radius: 50%; background: #e4dccb;
    }
    .step-dot.done { background: var(--accent); }
    .step-dot.current { background: var(--star); box-shadow: 0 0 0 3px rgba(212,168,75,0.35); }

    .play-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 16px;
      align-items: stretch;
    }
    .stage-card, .spin-card {
      background: #fff;
      border: 3px solid #e4dccb;
      border-radius: 22px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .robot-stage {
      min-height: 420px;
      background: linear-gradient(180deg, #f7f3ea, #efe8da);
      border-radius: 18px;
      display: grid;
      place-items: center;
      padding: 12px;
      overflow: hidden;
    }
    .robot-stack {
      width: min(260px, 72%);
      display: flex;
      flex-direction: column;
      align-items: center;
      filter: drop-shadow(0 12px 18px rgba(61,58,52,0.18));
      transition: transform 0.2s ease;
    }
    .robot-stack.pulse { animation: land 0.45s ease; }
    @keyframes land {
      0% { transform: scale(0.92) translateY(-8px); }
      60% { transform: scale(1.04) translateY(2px); }
      100% { transform: scale(1) translateY(0); }
    }
    .robot-stack img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      pointer-events: none;
    }
    .robot-stack img.head { width: 68%; z-index: 3; }
    .robot-stack img.body { width: 100%; margin-top: -6%; z-index: 2; }
    .robot-stack img.base { width: 78%; margin-top: -4%; z-index: 1; }
    .ghost {
      opacity: 0.22;
      filter: grayscale(0.3);
    }
    .spin-card { display: grid; gap: 14px; align-content: start; }
    .step-title { margin: 0; font-size: 1.25rem; font-weight: 800; color: var(--accent); text-align: center; }
    .slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .slot {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 3px solid #e4dccb;
      background: #faf6ee;
      display: grid;
      place-items: center;
      padding: 6px;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s, background 0.2s;
    }
    .slot img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .slot.lit {
      border-color: var(--star);
      background: #fff8e8;
      transform: scale(1.04);
      box-shadow: 0 0 0 3px rgba(212,168,75,0.25);
    }
    .slot.pick {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .actions-col { display: grid; gap: 10px; justify-items: center; }
    .feedback { min-height: 1.4em; color: var(--muted); text-align: center; font-weight: 700; }

    .end-robot {
      width: min(300px, 80vw);
      margin: 8px auto 0;
    }
    .end-robot .robot-stack { width: 100%; }
    .end-robot.dancing .robot-stack {
      animation: dance 0.7s ease-in-out infinite alternate;
    }
    .end-robot.dancing img.head {
      animation: nod 0.5s ease-in-out infinite alternate;
      transform-origin: bottom center;
    }
    @keyframes dance {
      from { transform: rotate(-3deg) translateY(0); }
      to { transform: rotate(3deg) translateY(-6px); }
    }
    @keyframes nod {
      from { transform: rotate(-4deg); }
      to { transform: rotate(4deg); }
    }
    .final-title { margin: 0; color: var(--muted); font-weight: 700; }
    h2 { margin: 0; color: var(--accent); font-size: 1.6rem; text-align: center; }

    @media (max-width: 820px) {
      .play-grid { grid-template-columns: 1fr; }
      .robot-stage { min-height: 320px; }
      .app { padding: 36px 16px 20px; }
    }
  </style>
</head>
<body data-i18n-title="game.robot.title">
  <div class="brick-scape" aria-hidden="true">
    <div class="float-brick b1"></div>
    <div class="float-brick b2"></div>
    <div class="float-brick b3"></div>
    <div class="float-brick b4"></div>
  </div>

  <div class="playfield">
    <div class="app">
      <div class="brick-rail" aria-hidden="true">
        <span class="mini-brick w3 red"></span>
        <span class="mini-brick w2 blue"></span>
        <span class="mini-brick w4 yellow"></span>
        <span class="mini-brick w2 green"></span>
        <span class="mini-brick w3 purple"></span>
        <span class="mini-brick w2 orange"></span>
      </div>

      <header>
        <div>
          <h1 data-i18n="game.robot.title">Build a Robot</h1>
          <p class="subtitle" data-i18n="robot.sub">Press the button · head, body, base</p>
        </div>
        <div class="header-tools">
          <a class="home-btn" href="index.html" data-i18n="common.home">Home</a>
          <button class="sound-btn" id="soundBtn" type="button" aria-pressed="false" aria-label="Mute sound">🔊</button>
          <div class="scoreboard">
            <div class="label" data-i18n="robot.part">Part</div>
            <div class="value"><span id="partNum">1</span> / 3</div>
          </div>
        </div>
      </header>

      <div class="progress" aria-hidden="true">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div id="startScreen" class="screen active">
        <div class="rule-card">
          <div style="font-size:2.4rem;margin-bottom:10px" aria-hidden="true">👆 → 🤖</div>
          <p class="rule-caption" data-i18n="robot.rule">Press the button three times.
Build your cute robot part by part!</p>
        </div>
        <div class="actions">
          <button class="primary" id="startBtn" type="button" data-i18n="common.go">Go!</button>
        </div>
      </div>

      <div id="gameScreen" class="screen">
        <div class="meta">
          <span class="level-pill" id="stepLabel">Part 1 · Head</span>
          <div class="die-pip" id="diePip" aria-hidden="true">?</div>
          <div class="steps-row" id="stepsRow"></div>
        </div>
        <div class="play-grid">
          <div class="stage-card">
            <div class="robot-stage">
              <div class="robot-stack" id="robot" aria-live="polite"></div>
            </div>
          </div>
          <div class="spin-card">
            <div class="step-title" id="spinTitle">Press for a head!</div>
            <div class="slots" id="slots"></div>
            <div class="actions-col">
              <button class="primary" id="spinBtn" type="button" data-i18n="robot.press">PRESS</button>
              <div class="feedback" id="feedback"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="endScreen" class="screen">
        <h2 data-i18n="robot.ready">Your robot is ready!</h2>
        <p class="final-title" data-i18n="robot.meet">★★★ Meet your creation ★★★</p>
        <div class="end-robot dancing" id="endRobot"></div>
        <div class="actions">
          <button class="primary" id="playAgainBtn" type="button" data-i18n="robot.again">Build again</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PART_DIR = "robot/parts-canva/";
    const COUNT = 6;
    function tt(key, vars) {
      return (window.AstarsI18n && AstarsI18n.t) ? AstarsI18n.t(key, vars) : key;
    }
    function steps() {
      return [
        { id: "head", label: tt("robot.stepHead"), spinTitle: tt("robot.spinHead") },
        { id: "body", label: tt("robot.stepBody"), spinTitle: tt("robot.spinBody") },
        { id: "base", label: tt("robot.stepBase"), spinTitle: tt("robot.spinBase") },
      ];
    }

    const state = {
      step: 0,
      picks: { head: null, body: null, base: null },
      spinning: false,
      soundOn: true,
    };

    const startScreen = document.getElementById("startScreen");
    const gameScreen = document.getElementById("gameScreen");
    const endScreen = document.getElementById("endScreen");
    const robotEl = document.getElementById("robot");
    const endRobot = document.getElementById("endRobot");
    const slotsEl = document.getElementById("slots");
    const spinBtn = document.getElementById("spinBtn");
    const feedback = document.getElementById("feedback");
    const stepLabel = document.getElementById("stepLabel");
    const spinTitle = document.getElementById("spinTitle");
    const diePip = document.getElementById("diePip");
    const partNum = document.getElementById("partNum");
    const progressBar = document.getElementById("progressBar");
    const stepsRow = document.getElementById("stepsRow");
    const soundBtn = document.getElementById("soundBtn");

    let audioCtx = null;
    function beep(freq, dur, type = "sine", gain = 0.04) {
      if (!state.soundOn) return;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        o.type = type;
        o.frequency.value = freq;
        g.gain.value = gain;
        o.connect(g); g.connect(audioCtx.destination);
        o.start();
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.stop(audioCtx.currentTime + dur);
      } catch (_) {}
    }

    function partSrc(kind, n) {
      return PART_DIR + kind + "-" + n + ".png";
    }

    function showScreen(which) {
      [startScreen, gameScreen, endScreen].forEach((el) => el.classList.remove("active"));
      which.classList.add("active");
    }

    function renderSteps() {
      const STEPS = steps();
      stepsRow.innerHTML = STEPS.map((_, i) => {
        let cls = "step-dot";
        if (i < state.step) cls += " done";
        if (i === state.step) cls += " current";
        return `<span class="${cls}"></span>`;
      }).join("");
    }

    function renderSlots(kind, highlight = null, pick = null) {
      slotsEl.innerHTML = "";
      for (let n = 1; n <= COUNT; n++) {
        const div = document.createElement("div");
        div.className = "slot";
        if (highlight === n) div.classList.add("lit");
        if (pick === n) div.classList.add("pick");
        div.innerHTML = `<img src="${partSrc(kind, n)}" alt="${kind} ${n}" />`;
        slotsEl.appendChild(div);
      }
    }

    function stackHtml(picks, ghostStep = null) {
      const layers = ["head", "body", "base"];
      return layers.map((id) => {
        const n = picks[id];
        if (n) {
          return `<img class="${id}" src="${partSrc(id, n)}" alt="${id}" />`;
        }
        const STEPS = steps();
        if (ghostStep !== null && STEPS[ghostStep] && STEPS[ghostStep].id === id) {
          return `<img class="${id} ghost" src="${partSrc(id, 1)}" alt="" />`;
        }
        return "";
      }).join("");
    }

    function renderRobot(animate = false) {
      robotEl.innerHTML = stackHtml(state.picks, state.step);
      robotEl.classList.toggle("pulse", animate);
      if (animate) {
        setTimeout(() => robotEl.classList.remove("pulse"), 450);
      }
    }

    function updateChrome() {
      const STEPS = steps();
      const step = STEPS[state.step] || STEPS[STEPS.length - 1];
      const done = Math.min(state.step, STEPS.length);
      partNum.textContent = String(Math.min(state.step + 1, STEPS.length));
      progressBar.style.width = ((done / STEPS.length) * 100) + "%";
      stepLabel.textContent = step.label;
      spinTitle.textContent = step.spinTitle;
      renderSteps();
      renderSlots(step.id);
      diePip.textContent = "?";
      feedback.textContent = "";
      renderRobot();
    }

    function finish() {
      showScreen(endScreen);
      endRobot.innerHTML = `<div class="robot-stack">${stackHtml(state.picks)}</div>`;
      endRobot.classList.add("dancing");
      progressBar.style.width = "100%";
      partNum.textContent = "3";
      beep(520, 0.12); setTimeout(() => beep(660, 0.14), 100); setTimeout(() => beep(784, 0.18), 220);
    }

    function sleep(ms) {
      return new Promise((r) => setTimeout(r, ms));
    }

    async function spin() {
      const STEPS = steps();
      if (state.spinning || state.step >= STEPS.length) return;
      state.spinning = true;
      spinBtn.disabled = true;
      const step = STEPS[state.step];
      const kind = step.id;
      let choice = 1 + Math.floor(Math.random() * COUNT);
      const ticks = 10 + Math.floor(Math.random() * 6);
      for (let i = 0; i < ticks; i++) {
        const n = 1 + (i % COUNT);
        renderSlots(kind, n);
        diePip.textContent = String(n);
        beep(180 + n * 40, 0.04, "square", 0.02);
        await sleep(55 + i * 12);
      }
      for (let i = 0; i < COUNT * 2; i++) {
        const n = 1 + (i % COUNT);
        renderSlots(kind, n);
        diePip.textContent = String(n);
        await sleep(70 + i * 8);
        if (i > COUNT && n === choice) break;
        if (i === COUNT * 2 - 1) choice = n;
      }
      renderSlots(kind, null, choice);
      diePip.textContent = String(choice);
      state.picks[kind] = choice;
      renderRobot(true);
      feedback.textContent = tt("robot.nice");
      beep(440, 0.1); setTimeout(() => beep(660, 0.12), 80);
      await sleep(550);
      state.step += 1;
      state.spinning = false;
      spinBtn.disabled = false;
      if (state.step >= STEPS.length) {
        finish();
      } else {
        updateChrome();
      }
    }

    function resetGame() {
      state.step = 0;
      state.picks = { head: null, body: null, base: null };
      state.spinning = false;
      spinBtn.disabled = false;
      endRobot.classList.remove("dancing");
      showScreen(gameScreen);
      updateChrome();
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      beep(400, 0.08);
      resetGame();
    });
    document.getElementById("playAgainBtn").addEventListener("click", () => {
      beep(400, 0.08);
      showScreen(startScreen);
      progressBar.style.width = "0%";
      partNum.textContent = "1";
    });
    spinBtn.addEventListener("click", spin);
    soundBtn.addEventListener("click", () => {
      state.soundOn = !state.soundOn;
      soundBtn.textContent = state.soundOn ? "🔊" : "🔇";
      soundBtn.setAttribute("aria-pressed", state.soundOn ? "false" : "true");
    });

    ["head", "body", "base"].forEach((kind) => {
      for (let n = 1; n <= COUNT; n++) {
        const img = new Image();
        img.src = partSrc(kind, n);
      }
    });

    document.addEventListener("astars:lang", () => {
      if (gameScreen.classList.contains("active")) updateChrome();
    });
  </script>
</body>
</html>
