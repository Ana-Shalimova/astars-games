<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Build a Robot</title>
  <style>
    :root {
      --bg: #f3efe6;
      --card: #fffcf7;
      --ink: #3d3a34;
      --muted: #7a7468;
      --accent: #5a7d6a;
      --accent-soft: #d5e4db;
      --warm-soft: #f0e6d4;
      --star: #d4a84b;
      --brick-red: #c4786a;
      --brick-blue: #6d8fb8;
      --brick-yellow: #d4b56a;
      --brick-green: #6a9a7c;
      --brick-cream: #efe6d4;
      --line: #2f2c28;
      --shadow: 0 14px 40px rgba(61, 58, 52, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top left, #efe8d8 0%, transparent 50%),
        radial-gradient(ellipse at bottom right, #dde8e2 0%, transparent 45%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .playfield { position: relative; width: min(1120px, 100%); z-index: 1; }

    .brick-scape {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }

    .float-brick {
      position: absolute; border-radius: 10px; opacity: 0.45;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.28), inset 0 -4px 0 rgba(0,0,0,0.08), 0 8px 18px rgba(61,58,52,0.1);
    }
    .float-brick::before {
      content: "";
      position: absolute; left: 50%; top: -10px; transform: translateX(-50%);
      width: calc(100% - 16px); height: 14px;
      background:
        radial-gradient(circle at 20% 50%, currentColor 0 5px, transparent 6px),
        radial-gradient(circle at 50% 50%, currentColor 0 5px, transparent 6px),
        radial-gradient(circle at 80% 50%, currentColor 0 5px, transparent 6px);
      opacity: 0.85;
    }
    .float-brick.b1 { width: 88px; height: 36px; background: var(--brick-red); color: #d99286; top: 8%; left: 4%; transform: rotate(-8deg); animation: bob 7s ease-in-out infinite; }
    .float-brick.b2 { width: 110px; height: 40px; background: var(--brick-blue); color: #8eafd0; top: 18%; right: 5%; transform: rotate(6deg); animation: bob 8s ease-in-out infinite 0.6s; }
    .float-brick.b3 { width: 72px; height: 32px; background: var(--brick-yellow); color: #e2c787; bottom: 16%; left: 7%; transform: rotate(10deg); animation: bob 6.5s ease-in-out infinite 1s; }
    .float-brick.b4 { width: 96px; height: 38px; background: var(--brick-green); color: #88b498; bottom: 10%; right: 8%; transform: rotate(-5deg); animation: bob 7.5s ease-in-out infinite 0.3s; }

    @keyframes bob {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -10px; }
    }

    .app {
      width: 100%;
      min-height: min(920px, calc(100vh - 40px));
      background: linear-gradient(180deg, #fffef9 0%, var(--card) 40%, #faf6ee 100%);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 44px 32px 28px;
      display: grid;
      gap: 16px;
      align-content: start;
      position: relative;
      border: 4px solid #e4dccb;
    }

    .app::before {
      content: "";
      position: absolute; top: -18px; left: 28px; right: 28px; height: 22px;
      background: radial-gradient(circle, var(--brick-cream) 0 9px, transparent 10px) 0 0 / 36px 22px repeat-x;
    }

    .brick-rail { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: -6px 0 2px; }
    .mini-brick {
      height: 18px; border-radius: 5px; position: relative;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 0 rgba(0,0,0,0.08);
    }
    .mini-brick::before {
      content: "";
      position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
      width: 8px; height: 8px; border-radius: 50%; background: inherit; filter: brightness(1.08);
    }
    .mini-brick.w2 { width: 34px; } .mini-brick.w3 { width: 48px; } .mini-brick.w4 { width: 62px; }
    .mini-brick.red { background: var(--brick-red); }
    .mini-brick.blue { background: var(--brick-blue); }
    .mini-brick.yellow { background: var(--brick-yellow); }
    .mini-brick.green { background: var(--brick-green); }
    .mini-brick.purple { background: #b59bc4; }
    .mini-brick.orange { background: #d4a07a; }

    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.2rem); color: var(--accent); }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; }
    .header-tools { display: flex; align-items: center; gap: 12px; }

    .sound-btn, .home-btn {
      border: none; border-radius: 14px; height: 56px; cursor: pointer;
      background: linear-gradient(180deg, #efe8da, #e4dccb);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.5), inset 0 -3px 0 rgba(0,0,0,0.08), 0 4px 0 #d0c6b4;
      font: inherit; font-weight: bold; color: var(--ink); text-decoration: none;
      display: inline-grid; place-items: center; line-height: 1;
    }
    .sound-btn { width: 56px; font-size: 1.6rem; }
    .home-btn { padding: 0 14px; font-size: 0.95rem; }
    .sound-btn[aria-pressed="true"] { opacity: 0.55; }

    .scoreboard {
      background: linear-gradient(180deg, #7ea890, var(--accent));
      color: white; border-radius: 14px; padding: 14px 18px 12px; min-width: 130px; text-align: right; position: relative;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.25), inset 0 -4px 0 rgba(0,0,0,0.1);
    }
    .scoreboard::before {
      content: "";
      position: absolute; top: -9px; right: 16px; width: 54px; height: 12px;
      background:
        radial-gradient(circle at 16% 50%, #8fbaa1 0 5px, transparent 6px),
        radial-gradient(circle at 50% 50%, #8fbaa1 0 5px, transparent 6px),
        radial-gradient(circle at 84% 50%, #8fbaa1 0 5px, transparent 6px);
    }
    .scoreboard .label { font-size: 0.8rem; color: rgba(255,255,255,0.85); text-transform: uppercase; letter-spacing: 0.06em; }
    .scoreboard .value { font-size: 1.5rem; font-weight: bold; }

    .progress { height: 16px; background: #e8e0d2; border-radius: 8px; overflow: hidden; border: 2px solid #ddd3c2; }
    .progress-bar {
      height: 100%; width: 0%;
      background: repeating-linear-gradient(
        90deg,
        var(--brick-green) 0 18px, #7eae90 18px 20px,
        var(--brick-yellow) 20px 38px, #dec488 38px 40px,
        var(--brick-blue) 40px 58px, #89a8cc 58px 60px,
        var(--brick-red) 60px 78px, #d18f82 78px 80px
      );
      transition: width 0.35s ease;
    }

    .screen { display: none; text-align: center; padding: 16px 8px 8px; }
    .screen.active { display: block; }
    #gameScreen.active { display: grid; gap: 14px; text-align: left; }
    .screen h2 { margin: 0 0 10px; font-size: 2.2rem; color: var(--accent); }
    .screen p { color: var(--muted); font-size: 1.15rem; line-height: 1.5; }

    .meta { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 1.05rem; flex-wrap: wrap; align-items: center; }
    .level-pill {
      background: linear-gradient(180deg, #e8f0ea, var(--accent-soft));
      color: var(--accent); padding: 8px 16px 6px; border-radius: 10px; font-weight: bold;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), inset 0 -2px 0 rgba(0,0,0,0.06); position: relative;
    }
    .level-pill::before {
      content: "";
      position: absolute; top: -6px; left: 14px; width: 8px; height: 8px; border-radius: 50%; background: #b7d0c0;
      box-shadow: 14px 0 0 #b7d0c0;
    }

    .die-pip {
      width: 42px; height: 42px; border: 3px solid var(--ink); border-radius: 10px;
      background: #fff; display: grid; place-items: center; font-weight: bold; font-size: 1.2rem;
      box-shadow: 0 3px 0 #cfc5b4;
    }

    .play-grid {
      display: grid;
      grid-template-columns: minmax(220px, 0.95fr) minmax(280px, 1.15fr);
      gap: 18px; align-items: start;
    }
    @media (max-width: 860px) { .play-grid { grid-template-columns: 1fr; } }

    .stage-card, .spin-card {
      background: linear-gradient(180deg, #fffefb, var(--warm-soft));
      border-radius: 18px; border: 3px solid #e5d9c4;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.65), 0 8px 0 #e0d3bc;
      padding: 18px 14px; position: relative;
    }
    .stage-card::after, .spin-card::after {
      content: "";
      position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
      width: min(220px, 55%); height: 16px;
      background: radial-gradient(circle, #e8dcc6 0 7px, transparent 8px) 0 0 / 32px 16px repeat-x;
    }

    .robot-stage { min-height: 420px; display: grid; place-items: center; padding: 8px; }
    .robot-svg { width: min(260px, 100%); height: auto; overflow: visible; }
    /* Must apply to slot previews too — not only .robot-svg */
    .app svg .stroke {
      fill: none !important;
      stroke: var(--line);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .app svg .fill-soft {
      fill: #f7f3ea;
      stroke: var(--line);
      stroke-width: 3;
      stroke-linejoin: round;
    }
    .app svg .ghost { opacity: 0.18; stroke-dasharray: 6 5; }
    .app svg .pupil { fill: var(--line); stroke: none; }

    /* End-screen silly dance */
    .end-robot {
      width: min(280px, 90vw);
      transform-origin: center bottom;
    }
    .end-robot.dancing .robot-svg {
      overflow: visible;
    }
    .end-robot.dancing .dance-root,
    .end-robot.dancing .robot-arm-left,
    .end-robot.dancing .robot-arm-right,
    .end-robot.dancing .robot-head-group {
      transform-box: view-box;
    }
    .end-robot.dancing .dance-root {
      transform-origin: 140px 300px;
      animation: robot-bounce 0.5s ease-in-out infinite alternate;
    }
    .end-robot.dancing .robot-arm-left {
      transform-origin: 92px 150px;
      animation: wave-left 0.5s ease-in-out infinite alternate;
    }
    .end-robot.dancing .robot-arm-right {
      transform-origin: 188px 150px;
      animation: wave-right 0.5s ease-in-out infinite alternate;
    }
    .end-robot.dancing .robot-head-group {
      transform-origin: 140px 100px;
      animation: head-nod 0.5s ease-in-out infinite alternate;
    }

    @keyframes robot-bounce {
      from { transform: translateY(0) rotate(-3deg); }
      to { transform: translateY(-14px) rotate(3deg); }
    }
    @keyframes wave-left {
      from { transform: rotate(8deg); }
      to { transform: rotate(-28deg); }
    }
    @keyframes wave-right {
      from { transform: rotate(-8deg); }
      to { transform: rotate(28deg); }
    }
    @keyframes head-nod {
      from { transform: rotate(-4deg); }
      to { transform: rotate(4deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .end-robot.dancing .dance-root,
      .end-robot.dancing .robot-arm-left,
      .end-robot.dancing .robot-arm-right,
      .end-robot.dancing .robot-head-group {
        animation: none;
      }
    }

    .step-title { text-align: center; font-size: 1.3rem; font-weight: bold; color: var(--accent); margin: 4px 0 12px; }

    .slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .slot {
      aspect-ratio: 1.05;
      border-radius: 14px; border: 3px solid #e5d9c4;
      background: linear-gradient(180deg, #fff, #f3ebe0);
      display: grid; place-items: center;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.6), 0 4px 0 #e0d3bc;
      transition: border-color 0.1s ease, transform 0.1s ease, background 0.1s ease;
      position: relative; overflow: hidden; padding: 6px;
    }
    .slot .pip {
      position: absolute; top: 4px; left: 6px; font-size: 0.75rem; font-weight: bold; color: var(--muted);
    }
    .slot.flash {
      border-color: var(--accent); background: var(--accent-soft); transform: scale(1.05);
      box-shadow: 0 0 0 4px rgba(90,125,106,0.25), 0 4px 0 #c5d6cb;
    }
    .slot.winner {
      border-color: var(--brick-yellow); background: #f7efd8; transform: scale(1.07);
      box-shadow: 0 0 0 4px rgba(212,168,75,0.35), 0 4px 0 #e0d3bc;
    }
    .slot svg { width: 90%; height: 90%; }

    .actions-col { display: flex; flex-direction: column; align-items: center; gap: 10px; }

    .primary {
      border: none; background: linear-gradient(180deg, #6f9a82, var(--accent));
      color: white; min-width: 160px; font: inherit; font-size: 1.5rem; font-weight: bold;
      border-radius: 14px; position: relative; padding: 26px 22px 18px; cursor: pointer;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.28), inset 0 -4px 0 rgba(0,0,0,0.12), 0 5px 0 #4a6b58;
    }
    .primary::before {
      content: "";
      position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
      width: 42px; height: 11px;
      background:
        radial-gradient(circle at 22% 50%, rgba(255,255,255,0.45) 0 4px, transparent 5px),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.45) 0 4px, transparent 5px),
        radial-gradient(circle at 78% 50%, rgba(255,255,255,0.45) 0 4px, transparent 5px);
    }
    .primary:hover:not(:disabled) { transform: translateY(-2px); }
    .primary:disabled { opacity: 0.55; cursor: default; }

    .feedback { min-height: 1.4em; text-align: center; font-size: 1.2rem; color: var(--accent); font-weight: bold; }

    .steps-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .step-dot { width: 12px; height: 12px; border-radius: 50%; background: #d5cbb8; }
    .step-dot.done { background: var(--accent); }
    .step-dot.current { background: var(--brick-yellow); box-shadow: 0 0 0 3px rgba(212,168,75,0.35); }

    .actions { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    #startScreen.active, #endScreen.active { display: grid; gap: 16px; justify-items: center; }

    .rule-card {
      width: min(520px, 100%);
      background: linear-gradient(180deg, #fffefb, var(--warm-soft));
      border-radius: 18px; padding: 24px; border: 3px solid #e5d9c4;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.65), 0 8px 0 #e0d3bc;
    }
    .rule-caption { margin: 0; color: var(--muted); font-size: 1.1rem; }
    .final-title { font-size: 1.35rem; color: var(--star); font-weight: bold; margin: 0; }

    @media (max-width: 700px) {
      .app { padding: 36px 14px 20px; min-height: auto; }
      .robot-stage { min-height: 320px; }
      .slots { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .float-brick { opacity: 0.25; scale: 0.85; }
    }
  </style>
</head>
<body>
  <div class="brick-scape" aria-hidden="true">
    <div class="float-brick b1"></div>
    <div class="float-brick b2"></div>
    <div class="float-brick b3"></div>
    <div class="float-brick b4"></div>
  </div>

  <div class="playfield">
  <div class="app">
    <div class="brick-rail" aria-hidden="true">
      <span class="mini-brick w3 red"></span>
      <span class="mini-brick w2 blue"></span>
      <span class="mini-brick w4 yellow"></span>
      <span class="mini-brick w2 green"></span>
      <span class="mini-brick w3 purple"></span>
      <span class="mini-brick w2 orange"></span>
    </div>

    <header>
      <div>
        <h1>Build a Robot</h1>
        <p class="subtitle">Press the button · head, face, torso, arms, legs, feet</p>
      </div>
      <div class="header-tools">
        <a class="home-btn" href="index.html">Home</a>
        <button class="sound-btn" id="soundBtn" type="button" aria-pressed="false" aria-label="Mute sound">🔊</button>
        <div class="scoreboard">
          <div class="label">Part</div>
          <div class="value"><span id="partNum">1</span> / 6</div>
        </div>
      </div>
    </header>

    <div class="progress" aria-hidden="true">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="startScreen" class="screen active">
      <div class="rule-card">
        <div style="font-size:2.4rem;margin-bottom:10px" aria-hidden="true">👆 → 🤖</div>
        <p class="rule-caption">
          Press the button six times.<br />
          The slots flash — then a part joins your robot!<br />
          <span style="display:inline-block;margin-top:8px">Head → Face → Torso → Arms → Legs → Feet</span>
        </p>
      </div>
      <div class="actions">
        <button class="primary" id="startBtn" type="button">Go!</button>
      </div>
    </div>

    <div id="gameScreen" class="screen">
      <div class="meta">
        <span class="level-pill" id="stepLabel">Part 1 · Head</span>
        <div class="die-pip" id="diePip" aria-hidden="true">?</div>
        <div class="steps-row" id="stepsRow"></div>
      </div>

      <div class="play-grid">
        <div class="stage-card">
          <div class="robot-stage">
            <div id="robot" aria-live="polite"></div>
          </div>
        </div>
        <div class="spin-card">
          <div class="step-title" id="spinTitle">Press for a head!</div>
          <div class="slots" id="slots"></div>
          <div class="actions-col">
            <button class="primary" id="spinBtn" type="button">PRESS</button>
            <div class="feedback" id="feedback"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="endScreen" class="screen">
      <h2>Your robot is ready!</h2>
      <p class="final-title">★★★ Meet your creation ★★★</p>
      <div class="end-robot" id="endRobot"></div>
      <div class="actions">
        <button class="primary" id="playAgainBtn" type="button">Build again</button>
      </div>
    </div>
  </div>
  </div>

  <script>
    const STEPS = [
      { id: "head", label: "Part 1 · Head", spinTitle: "Press for a head!" },
      { id: "face", label: "Part 2 · Face", spinTitle: "Press for a face!" },
      { id: "torso", label: "Part 3 · Torso", spinTitle: "Press for a torso!" },
      { id: "arms", label: "Part 4 · Arms", spinTitle: "Press for arms!" },
      { id: "legs", label: "Part 5 · Legs", spinTitle: "Press for legs!" },
      { id: "feet", label: "Part 6 · Feet", spinTitle: "Press for feet!" },
    ];

    /* 6 options per row — inspired by classic ROLL A ROBOT charts */
    const PARTS = {
      head: [
        { id: 1, antenna: "loop-left", shape: "square" },
        { id: 2, antenna: "stalks", shape: "dome" },
        { id: 3, antenna: "single", shape: "house" },
        { id: 4, antenna: "twin-ball", shape: "hex" },
        { id: 5, antenna: "dish", shape: "trap" },
        { id: 6, antenna: "twin-loop", shape: "arch" },
      ],
      face: [
        { id: 1, eyes: "bug", mouth: "grin" },
        { id: 2, eyes: "rect", mouth: "flat" },
        { id: 3, eyes: "round", mouth: "o" },
        { id: 4, eyes: "line", mouth: "zig" },
        { id: 5, eyes: "big", mouth: "smile" },
        { id: 6, eyes: "dot", mouth: "teeth" },
      ],
      torso: [
        { id: 1, panel: "gauges" },
        { id: 2, panel: "screen" },
        { id: 3, panel: "buttons" },
        { id: 4, panel: "vent" },
        { id: 5, panel: "dial" },
        { id: 6, panel: "grid" },
      ],
      arms: [
        { id: 1, style: "segment" },
        { id: 2, style: "pincer" },
        { id: 3, style: "zigzag" },
        { id: 4, style: "blocky" },
        { id: 5, style: "tube" },
        { id: 6, style: "hook" },
      ],
      legs: [
        { id: 1, style: "pillar" },
        { id: 2, style: "spring" },
        { id: 3, style: "segment" },
        { id: 4, style: "thin" },
        { id: 5, style: "tank" },
        { id: 6, style: "joint" },
      ],
      feet: [
        { id: 1, style: "dome" },
        { id: 2, style: "wheel" },
        { id: 3, style: "boot" },
        { id: 4, style: "plate" },
        { id: 5, style: "tread" },
        { id: 6, style: "ball" },
      ],
    };

    const state = {
      step: 0,
      picks: { head: null, face: null, torso: null, arms: null, legs: null, feet: null },
      spinning: false,
      soundOn: true,
      lastRoll: null,
    };

    const els = {
      startScreen: document.getElementById("startScreen"),
      gameScreen: document.getElementById("gameScreen"),
      endScreen: document.getElementById("endScreen"),
      startBtn: document.getElementById("startBtn"),
      playAgainBtn: document.getElementById("playAgainBtn"),
      soundBtn: document.getElementById("soundBtn"),
      partNum: document.getElementById("partNum"),
      progressBar: document.getElementById("progressBar"),
      stepLabel: document.getElementById("stepLabel"),
      spinTitle: document.getElementById("spinTitle"),
      stepsRow: document.getElementById("stepsRow"),
      diePip: document.getElementById("diePip"),
      slots: document.getElementById("slots"),
      spinBtn: document.getElementById("spinBtn"),
      feedback: document.getElementById("feedback"),
      robot: document.getElementById("robot"),
      endRobot: document.getElementById("endRobot"),
    };

    const audio = {
      ctx: null, master: null,
      unlock() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.master.gain.value = state.soundOn ? 0.55 : 0;
          this.master.connect(this.ctx.destination);
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
      },
      setMuted(muted) {
        state.soundOn = !muted;

    function fullRobotSvg(picks, ghost) {
      const cx = 140;
      const headY = 78;
      const torsoY = 168;
      const torsoBottom = torsoY + 40;
      // Legs tuck slightly under the torso so they look attached
      const legY = torsoBottom - 8;
      const footY = legY + 66;

      const g = (html, isGhost) => (isGhost ? html.replace(/class="fill-soft"/g, 'class="fill-soft ghost"').replace(/class="stroke"/g, 'class="stroke ghost"') : html);

      const armY = torsoY - 10;
      const armStyle = picks.arms ? picks.arms.style : "segment";

      let leftArm = picks.arms
        ? armSideSvg(armStyle, "left", cx, armY)
        : ghost
          ? g(armSideSvg("segment", "left", cx, armY), true)
          : "";
      let rightArm = picks.arms
        ? armSideSvg(armStyle, "right", cx, armY)
        : ghost
          ? g(armSideSvg("segment", "right", cx, armY), true)
          : "";

      let torso = picks.torso
        ? torsoSvg(picks.torso.panel, cx, torsoY)
        : ghost
          ? g(torsoSvg("gauges", cx, torsoY), true)
          : "";

      let head = "";
      if (picks.head) {
        const shape = picks.head.shape;
        head =
          antennaSvg(picks.head.antenna, cx, headTopY(shape, headY)) +
          headShapeSvg(shape, cx, headY) +
          (picks.face ? faceSvg(picks.face, cx, headY + 2) : "");
      } else if (ghost) {
        head = g(headShapeSvg("round", cx, headY), true);
      }

      let legs = picks.legs
        ? legsSvg(picks.legs.style, cx, legY)
        : ghost
          ? g(legsSvg("pillar", cx, legY), true)
          : "";

      let feet = picks.feet
        ? feetSvg(picks.feet.style, cx, footY)
        : ghost
          ? g(feetSvg("dome", cx, footY), true)
          : "";

      return `<svg class="robot-svg" viewBox="0 0 280 340" role="img" aria-label="Your robot">
        <g class="dance-root">
          <g class="robot-arm-left">${leftArm}</g>
          <g class="robot-arm-right">${rightArm}</g>
          ${torso}
          <g class="robot-head-group">${head}</g>
          ${legs}
          ${feet}
        </g>
      </svg>`;
    }

    function renderRobot(target, picks, showGhosts) {
      target.innerHTML = fullRobotSvg(picks, showGhosts);
    }

    function renderStepsRow() {
      els.stepsRow.innerHTML = STEPS.map((_, i) => {
        let cls = "step-dot";
        if (i < state.step) cls += " done";
        if (i === state.step) cls += " current";
        return `<span class="${cls}"></span>`;
      }).join("");
    }

    function renderSlots() {
      const step = STEPS[state.step];
      const options = PARTS[step.id];
      els.slots.innerHTML = options
        .map(
          (part, i) =>
            `<div class="slot" data-index="${i}"><span class="pip">${i + 1}</span>${previewSvg(step.id, part)}</div>`
        )
        .join("");
    }

    function updateHud() {
      const step = STEPS[state.step];
      els.partNum.textContent = String(state.step + 1);
      els.progressBar.style.width = `${(state.step / STEPS.length) * 100}%`;
      els.stepLabel.textContent = step.label;
      els.spinTitle.textContent = step.spinTitle;
      els.diePip.textContent = state.lastRoll ? String(state.lastRoll) : "?";
      els.feedback.textContent = "";
      renderStepsRow();
      renderSlots();
      renderRobot(els.robot, state.picks, true);
      els.spinBtn.disabled = state.spinning;
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function runSpin() {
      if (state.spinning) return;
      audio.unlock();
      state.spinning = true;
      els.spinBtn.disabled = true;
      els.feedback.textContent = "";
      els.diePip.textContent = "…";

      const step = STEPS[state.step];
      const options = PARTS[step.id];
      const slotEls = [...els.slots.querySelectorAll(".slot")];
      const winnerIndex = randInt(0, options.length - 1);

      let flashes = 20 + randInt(0, 8);
      let delay = 55;
      let idx = randInt(0, options.length - 1);

      for (let i = 0; i < flashes; i++) {
        slotEls.forEach((el) => el.classList.remove("flash", "winner"));
        idx = (idx + 1) % options.length;
        if (i > flashes - options.length - 1) {
          idx = (winnerIndex - (flashes - 1 - i) + options.length * 4) % options.length;
        }
        slotEls[idx].classList.add("flash");
        els.diePip.textContent = String(idx + 1);
        audio.tick();
        await sleep(delay);
        delay += 11;
      }

      slotEls.forEach((el) => el.classList.remove("flash"));
      slotEls[winnerIndex].classList.add("winner");
      const chosen = options[winnerIndex];
      state.picks[step.id] = chosen;
      state.lastRoll = winnerIndex + 1;
      els.diePip.textContent = String(state.lastRoll);
      renderRobot(els.robot, state.picks, true);
      audio.win();
      els.feedback.textContent = `Got part ${state.lastRoll}!`;

      await sleep(950);

      state.step += 1;
      state.spinning = false;

      if (state.step >= STEPS.length) {
        els.progressBar.style.width = "100%";
        finishGame();
      } else {
        state.lastRoll = null;
        updateHud();
      }
    }

    function finishGame() {
      audio.done();
      els.endRobot.classList.remove("dancing");
      renderRobot(els.endRobot, state.picks, false);
      showScreen("end");
      // Restart animation cleanly after paint
      requestAnimationFrame(() => {
        els.endRobot.classList.add("dancing");
      });
    }

    function stopDance() {
      els.endRobot.classList.remove("dancing");
    }

    function startGame() {
      audio.unlock();
      state.step = 0;
      state.picks = { head: null, face: null, torso: null, arms: null, legs: null, feet: null };
      state.spinning = false;
      state.lastRoll = null;
      showScreen("start");
    }

    function beginPlay() {
      audio.unlock();
      state.step = 0;
      state.picks = { head: null, face: null, torso: null, arms: null, legs: null, feet: null };
      state.spinning = false;
      state.lastRoll = null;
      showScreen("game");
      updateHud();
    }

    els.startBtn.addEventListener("click", beginPlay);
    els.playAgainBtn.addEventListener("click", () => {
      stopDance();
      startGame();
    });
    els.spinBtn.addEventListener("click", runSpin);
    els.soundBtn.addEventListener("click", () => {
      audio.unlock();
      audio.setMuted(state.soundOn);
    });
  </script>
</body>
</html>
