<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pexeso</title>
  <style>
    :root {
      --bg: #f3efe6;
      --card: #fffcf7;
      --ink: #3d3a34;
      --muted: #7a7468;
      --accent: #5a7d6a;
      --accent-soft: #d5e4db;
      --warm-soft: #f0e6d4;
      --wrong: #a66b5e;
      --star: #d4a84b;
      --brick-red: #c4786a;
      --brick-blue: #6d8fb8;
      --brick-yellow: #d4b56a;
      --brick-green: #6a9a7c;
      --brick-cream: #efe6d4;
      --shadow: 0 14px 40px rgba(61, 58, 52, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at top left, #efe8d8 0%, transparent 50%),
        radial-gradient(ellipse at bottom right, #dde8e2 0%, transparent 45%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .playfield { position: relative; width: min(1100px, 100%); z-index: 1; }

    .brick-scape {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
    }
    .float-brick {
      position: absolute; border-radius: 10px; opacity: 0.45;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.28), inset 0 -4px 0 rgba(0,0,0,0.08), 0 8px 18px rgba(61,58,52,0.1);
    }
    .float-brick::before {
      content: "";
      position: absolute; left: 50%; top: -10px; transform: translateX(-50%);
      width: calc(100% - 16px); height: 14px;
      background:
        radial-gradient(circle at 20% 50%, currentColor 0 5px, transparent 6px),
        radial-gradient(circle at 50% 50%, currentColor 0 5px, transparent 6px),
        radial-gradient(circle at 80% 50%, currentColor 0 5px, transparent 6px);
      opacity: 0.85;
    }
    .float-brick.b1 { width: 88px; height: 36px; background: var(--brick-red); color: #d99286; top: 8%; left: 4%; transform: rotate(-8deg); animation: bob 7s ease-in-out infinite; }
    .float-brick.b2 { width: 110px; height: 40px; background: var(--brick-blue); color: #8eafd0; top: 18%; right: 5%; transform: rotate(6deg); animation: bob 8s ease-in-out infinite 0.6s; }
    .float-brick.b3 { width: 72px; height: 32px; background: var(--brick-yellow); color: #e2c787; bottom: 16%; left: 7%; transform: rotate(10deg); animation: bob 6.5s ease-in-out infinite 1s; }
    .float-brick.b4 { width: 96px; height: 38px; background: var(--brick-green); color: #88b498; bottom: 10%; right: 8%; transform: rotate(-5deg); animation: bob 7.5s ease-in-out infinite 0.3s; }

    @keyframes bob {
      0%, 100% { translate: 0 0; }
      50% { translate: 0 -10px; }
    }

    .app {
      width: 100%;
      min-height: min(920px, calc(100vh - 32px));
      background: linear-gradient(180deg, #fffef9 0%, var(--card) 40%, #faf6ee 100%);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 40px 24px 24px;
      display: grid;
      gap: 12px;
      align-content: start;
      grid-template-rows: auto auto auto 1fr;
      position: relative;
      border: 4px solid #e4dccb;
    }

    .app::before {
      content: "";
      position: absolute; top: -18px; left: 28px; right: 28px; height: 22px;
      background: radial-gradient(circle, var(--brick-cream) 0 9px, transparent 10px) 0 0 / 36px 22px repeat-x;
    }

    .brick-rail { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: -4px 0 2px; }
    .mini-brick {
      height: 18px; border-radius: 5px; position: relative;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), inset 0 -2px 0 rgba(0,0,0,0.08);
    }
    .mini-brick::before {
      content: "";
      position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
      width: 8px; height: 8px; border-radius: 50%; background: inherit; filter: brightness(1.08);
    }
    .mini-brick.w2 { width: 34px; } .mini-brick.w3 { width: 48px; } .mini-brick.w4 { width: 62px; }
    .mini-brick.red { background: var(--brick-red); }
    .mini-brick.blue { background: var(--brick-blue); }
    .mini-brick.yellow { background: var(--brick-yellow); }
    .mini-brick.green { background: var(--brick-green); }
    .mini-brick.purple { background: #b59bc4; }
    .mini-brick.orange { background: #d4a07a; }

    header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.2rem); color: var(--accent); }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 1.05rem; }
    .header-tools { display: flex; align-items: center; gap: 10px; }

    .sound-btn, .home-btn {
      border: none; border-radius: 14px; height: 56px; cursor: pointer;
      background: linear-gradient(180deg, #efe8da, #e4dccb);
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.5), inset 0 -3px 0 rgba(0,0,0,0.08), 0 4px 0 #d0c6b4;
      font: inherit; font-weight: bold; color: var(--ink); text-decoration: none;
      display: inline-grid; place-items: center; line-height: 1;
    }
    .sound-btn { width: 56px; font-size: 1.6rem; }
    .home-btn { padding: 0 14px; font-size: 0.95rem; }
    .sound-btn[aria-pressed="true"] { opacity: 0.55; }

    .scoreboard {
      background: linear-gradient(180deg, #7ea890, var(--accent));
      color: white; border-radius: 14px; padding: 14px 18px 12px; min-width: 130px;
      text-align: right; position: relative;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.25), inset 0 -4px 0 rgba(0,0,0,0.1);
    }
    .scoreboard::before {
      content: "";
      position: absolute; top: -9px; right: 16px; width: 54px; height: 12px;
      background:
        radial-gradient(circle at 16% 50%, #8fbaa1 0 5px, transparent 6px),
        radial-gradient(circle at 50% 50%, #8fbaa1 0 5px, transparent 6px),
        radial-gradient(circle at 84% 50%, #8fbaa1 0 5px, transparent 6px);
    }
    .scoreboard .label {
      font-size: 0.8rem; color: rgba(255,255,255,0.85);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .scoreboard .value { font-size: 1.45rem; font-weight: bold; }

    .progress {
      height: 14px; border-radius: 999px; background: #e8dfd0; overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(61,58,52,0.08);
    }
    .progress-bar {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #d4a84b, #e0c06a);
      border-radius: inherit;
      transition: width 0.35s ease;
    }

    .screen { display: none; text-align: center; padding: 8px 4px; min-height: 0; }
    .screen.active { display: grid; gap: 16px; justify-items: center; align-content: center; }
    #playScreen.active {
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-content: stretch;
      text-align: left;
      width: 100%;
      min-height: 0;
      flex: 1;
    }

    .screen h2 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.1rem); color: var(--accent); }
    .screen p { color: var(--muted); font-size: 1.1rem; line-height: 1.45; margin: 0; }

    .rule-card {
      width: min(520px, 100%);
      background: linear-gradient(180deg, #fffefb, var(--warm-soft));
      border-radius: 18px; padding: 24px 20px;
      border: 3px solid #e5d9c4;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.65), 0 8px 0 #e0d3bc;
      position: relative;
    }
    .rule-card::after {
      content: "";
      position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
      width: min(220px, 55%); height: 16px;
      background: radial-gradient(circle, #e8dcc6 0 7px, transparent 8px) 0 0 / 32px 16px repeat-x;
    }
    .rule-demo {
      display: flex; justify-content: center; gap: 14px; margin-bottom: 12px;
      font-size: clamp(2.4rem, 8vw, 3.2rem); line-height: 1;
    }

    .intro-badge {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--accent-soft); color: var(--accent);
      border-radius: 999px; padding: 8px 16px; font-weight: bold;
    }
    .intro-badge .dots { display: inline-flex; gap: 6px; }
    .intro-badge .dot {
      width: 10px; height: 10px; border-radius: 50%; background: #b7d0c0;
    }
    .intro-badge .dot.on { background: var(--accent); }

    .meta {
      width: 100%;
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; flex-wrap: wrap;
    }
    .level-pill {
      display: inline-block;
      background: var(--accent-soft); color: var(--accent);
      border-radius: 999px; padding: 6px 12px; font-weight: bold; font-size: 0.95rem;
    }
    .hint { color: var(--muted); font-size: 1rem; }

    .board-wrap {
      width: 100%;
      min-height: 0;
      display: grid;
      place-items: stretch;
    }

    .board {
      width: 100%;
      height: 100%;
      min-height: min(58vh, 560px);
      display: grid;
      gap: clamp(8px, 1.6vw, 14px);
      padding: 10px;
      background: linear-gradient(180deg, #fffefb, var(--warm-soft));
      border-radius: 20px;
      border: 3px solid #e5d9c4;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.65), 0 8px 0 #e0d3bc;
    }
    .board.cols-5 { grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr); }
    .board.cols-4 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }

    .tile {
      position: relative;
      border: none;
      padding: 0;
      border-radius: 16px;
      cursor: pointer;
      background: transparent;
      perspective: 700px;
      min-height: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .tile:disabled { cursor: default; }
    .tile-inner {
      position: absolute; inset: 0;
      transform-style: preserve-3d;
      transition: transform 0.35s ease;
      border-radius: 16px;
    }
    .tile.flipped .tile-inner,
    .tile.matched .tile-inner {
      transform: rotateY(180deg);
    }
    .tile-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      border-radius: 16px;
      display: grid;
      place-items: center;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.35),
        inset 0 -4px 0 rgba(0,0,0,0.08),
        0 4px 0 rgba(61,58,52,0.08);
    }
    .tile-back {
      background: linear-gradient(180deg, #7ea890, var(--accent));
    }
    .tile-back::before {
      content: "";
      width: 42%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 40%, rgba(255,255,255,0.35) 0 28%, transparent 30%),
        #8fbaa1;
      box-shadow: 0 3px 0 rgba(0,0,0,0.12);
    }
    .tile-front {
      background: linear-gradient(180deg, #fffef9, #f3ebe0);
      transform: rotateY(180deg);
      font-size: clamp(2.4rem, 9vw, 4.6rem);
      line-height: 1;
      border: 3px solid #e5d9c4;
    }
    .tile.matched .tile-front {
      background: linear-gradient(180deg, #eef6f0, var(--accent-soft));
      border-color: #b7d0c0;
    }
    .tile.wrong .tile-front {
      animation: shake 0.35s ease;
    }
    @keyframes shake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      25% { transform: rotateY(180deg) translateX(-4px); }
      75% { transform: rotateY(180deg) translateX(4px); }
    }

    .feedback {
      min-height: 1.4em;
      text-align: center;
      font-size: 1.15rem;
      color: var(--accent);
      font-weight: bold;
    }

    .actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }

    .primary {
      border: none; background: linear-gradient(180deg, #6f9a82, var(--accent));
      color: white; min-width: 150px; font: inherit; font-size: 1.45rem; font-weight: bold;
      border-radius: 14px; position: relative; padding: 26px 22px 18px; cursor: pointer;
      box-shadow: inset 0 2px 0 rgba(255,255,255,0.28), inset 0 -4px 0 rgba(0,0,0,0.12), 0 5px 0 #4a6b58;
    }
    .primary::before {
      content: "";
      position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
      width: 42px; height: 11px;
      background:
        radial-gradient(circle at 22% 50%, rgba(255,255,255,0.45) 0 4px, transparent 5px),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.45) 0 4px, transparent 5px),
        radial-gradient(circle at 78% 50%, rgba(255,255,255,0.45) 0 4px, transparent 5px);
    }
    .primary:hover { transform: translateY(-2px); }

    .win-stars {
      font-size: clamp(2rem, 6vw, 2.8rem);
      color: var(--star);
      letter-spacing: 0.08em;
    }

    @media (max-width: 700px) {
      .board.cols-5 {
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 1fr);
      }
      .board.cols-5 .tile:nth-child(9),
      .board.cols-5 .tile:nth-child(10) {
        /* keep 10 tiles; last row can span visually via auto placement */
      }
      .board { min-height: min(62vh, 520px); }
      .tile-front { font-size: clamp(2rem, 11vw, 3.4rem); }
    }

    @media (max-width: 420px) {
      .board.cols-5 {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(5, 1fr);
      }
      .board.cols-4 {
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="brick-scape" aria-hidden="true">
    <div class="float-brick b1"></div>
    <div class="float-brick b2"></div>
    <div class="float-brick b3"></div>
    <div class="float-brick b4"></div>
  </div>

  <div class="playfield">
  <div class="app">
    <div class="brick-rail" aria-hidden="true">
      <span class="mini-brick w3 red"></span>
      <span class="mini-brick w2 blue"></span>
      <span class="mini-brick w4 yellow"></span>
      <span class="mini-brick w2 green"></span>
      <span class="mini-brick w3 purple"></span>
      <span class="mini-brick w2 orange"></span>
    </div>

    <header>
      <div>
        <h1>Pexeso</h1>
        <p class="subtitle">Find the matching faces</p>
      </div>
      <div class="header-tools">
        <a class="home-btn" href="index.html">Home</a>
        <button class="sound-btn" id="soundBtn" type="button" aria-pressed="false" aria-label="Mute sound">🔊</button>
        <div class="scoreboard">
          <div class="label">Stars</div>
          <div class="value"><span id="score">0</span> / <span id="totalScore">13</span></div>
        </div>
      </div>
    </header>

    <div class="progress" aria-hidden="true">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="startScreen" class="screen active">
      <div class="rule-card">
        <div class="rule-demo" aria-hidden="true">😀 ⟷ 😀</div>
        <p>
          Tap two cards.<br />
          Match the same feeling to earn a star.
        </p>
      </div>
      <div class="actions">
        <button class="primary" id="startBtn" type="button">Go!</button>
      </div>
    </div>

    <div id="introScreen" class="screen">
      <div class="intro-badge">
        <span class="dots" aria-hidden="true">
          <span class="dot" id="dot1"></span>
          <span class="dot" id="dot2"></span>
        </span>
        <span id="introLevelText">Level 1</span>
      </div>
      <div class="rule-card">
        <div class="rule-demo" id="ruleDemo" aria-hidden="true"></div>
        <p id="ruleCaption"></p>
      </div>
      <div class="actions">
        <button class="primary" id="beginBtn" type="button">Go!</button>
      </div>
    </div>

    <div id="playScreen" class="screen">
      <div class="meta">
        <span class="level-pill" id="levelLabel">Level 1 · 5 pairs</span>
        <span class="hint">Tap two matching faces</span>
      </div>
      <div class="board-wrap">
        <div class="board cols-5" id="board" aria-label="Pexeso board"></div>
      </div>
      <div class="feedback" id="feedback" aria-live="polite"></div>
    </div>

    <div id="winScreen" class="screen">
      <h2>You matched them all!</h2>
      <div class="win-stars" id="winStars">★★★</div>
      <p id="winMessage">Nice memory!</p>
      <div class="actions">
        <button class="primary" id="againBtn" type="button">Play again</button>
      </div>
    </div>
  </div>
  </div>

  <script>
    const LEVELS = [
      {
        level: 1,
        pairs: 5,
        emojis: ["😀", "😢", "😠", "😮", "😍"],
        label: "Level 1 · 5 pairs",
        caption: "Five feelings · five pairs to find.",
      },
      {
        level: 2,
        pairs: 8,
        emojis: ["😀", "😢", "😠", "😮", "😍", "😎", "😴", "🤢"],
        label: "Level 2 · 8 pairs",
        caption: "Eight feelings · a bigger board!",
      },
    ];

    const TOTAL_STARS = LEVELS.reduce((sum, level) => sum + level.pairs, 0);

    const state = {
      levelIndex: 0,
      cards: [],
      flipped: [],
      matched: 0,
      score: 0,
      locked: false,
      soundOn: true,
    };

    const els = {
      startScreen: document.getElementById("startScreen"),
      introScreen: document.getElementById("introScreen"),
      playScreen: document.getElementById("playScreen"),
      winScreen: document.getElementById("winScreen"),
      startBtn: document.getElementById("startBtn"),
      beginBtn: document.getElementById("beginBtn"),
      againBtn: document.getElementById("againBtn"),
      soundBtn: document.getElementById("soundBtn"),
      board: document.getElementById("board"),
      score: document.getElementById("score"),
      totalScore: document.getElementById("totalScore"),
      progressBar: document.getElementById("progressBar"),
      levelLabel: document.getElementById("levelLabel"),
      feedback: document.getElementById("feedback"),
      introLevelText: document.getElementById("introLevelText"),
      ruleDemo: document.getElementById("ruleDemo"),
      ruleCaption: document.getElementById("ruleCaption"),
      dot1: document.getElementById("dot1"),
      dot2: document.getElementById("dot2"),
      winStars: document.getElementById("winStars"),
      winMessage: document.getElementById("winMessage"),
    };

    els.totalScore.textContent = String(TOTAL_STARS);

    const audio = {
      ctx: null,
      unlock() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          this.ctx = new AC();
        }
        if (this.ctx.state === "suspended") this.ctx.resume();
      },
      setMuted(on) {
        state.soundOn = !on;
        els.soundBtn.textContent = state.soundOn ? "🔊" : "🔇";
        els.soundBtn.setAttribute("aria-pressed", state.soundOn ? "false" : "true");
      },
      tone(freq, dur, type = "sine", gain = 0.04) {
        if (!state.soundOn || !this.ctx) return;
        const t0 = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        g.gain.setValueAtTime(gain, t0);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start(t0);
        osc.stop(t0 + dur);
      },
      flip() { this.tone(520, 0.08, "triangle", 0.03); },
      match() { this.tone(660, 0.12); setTimeout(() => this.tone(880, 0.16), 70); },
      miss() { this.tone(220, 0.14, "square", 0.025); },
      done() {
        this.tone(523, 0.12);
        setTimeout(() => this.tone(659, 0.12), 100);
        setTimeout(() => this.tone(784, 0.2), 200);
      },
    };

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function showScreen(name) {
      ["start", "intro", "play", "win"].forEach((key) => {
        els[`${key}Screen`].classList.toggle("active", key === name);
      });
    }

    function updateScore() {
      els.score.textContent = String(state.score);
      els.progressBar.style.width = `${(state.score / TOTAL_STARS) * 100}%`;
    }

    function renderIntro(levelIndex) {
      state.levelIndex = levelIndex;
      const level = LEVELS[levelIndex];
      els.introLevelText.textContent = `Level ${level.level}`;
      els.dot1.classList.toggle("on", level.level >= 1);
      els.dot2.classList.toggle("on", level.level >= 2);
      els.ruleDemo.textContent = level.emojis.slice(0, 4).join(" ");
      els.ruleCaption.textContent = level.caption;
      showScreen("intro");
    }

    function buildBoard() {
      const level = LEVELS[state.levelIndex];
      const deck = shuffle(
        level.emojis.flatMap((emoji, pairId) => [
          { id: `${pairId}-a`, pairId, emoji },
          { id: `${pairId}-b`, pairId, emoji },
        ])
      );

      state.cards = deck;
      state.flipped = [];
      state.matched = 0;
      state.locked = false;
      els.feedback.textContent = "";
      els.levelLabel.textContent = level.label;

      els.board.className = `board ${level.pairs === 5 ? "cols-5" : "cols-4"}`;
      els.board.replaceChildren();

      deck.forEach((card, index) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tile";
        btn.dataset.index = String(index);
        btn.setAttribute("aria-label", "Hidden emotion card");
        btn.innerHTML = `
          <span class="tile-inner">
            <span class="tile-face tile-back" aria-hidden="true"></span>
            <span class="tile-face tile-front" aria-hidden="true">${card.emoji}</span>
          </span>
        `;
        btn.addEventListener("click", () => onTile(index));
        els.board.appendChild(btn);
      });
    }

    function tileEl(index) {
      return els.board.children[index];
    }

    function onTile(index) {
      if (state.locked) return;
      const card = state.cards[index];
      const el = tileEl(index);
      if (!el || el.classList.contains("flipped") || el.classList.contains("matched")) return;

      audio.unlock();
      audio.flip();
      el.classList.add("flipped");
      el.setAttribute("aria-label", `Emotion ${card.emoji}`);
      state.flipped.push(index);

      if (state.flipped.length < 2) return;

      state.locked = true;
      const [a, b] = state.flipped;
      const cardA = state.cards[a];
      const cardB = state.cards[b];

      if (cardA.pairId === cardB.pairId) {
        audio.match();
        tileEl(a).classList.add("matched");
        tileEl(b).classList.add("matched");
        tileEl(a).disabled = true;
        tileEl(b).disabled = true;
        state.matched += 1;
        state.score += 1;
        updateScore();
        els.feedback.textContent = "Match! ⭐";
        state.flipped = [];
        state.locked = false;

        if (state.matched >= LEVELS[state.levelIndex].pairs) {
          setTimeout(onLevelComplete, 550);
        }
      } else {
        audio.miss();
        tileEl(a).classList.add("wrong");
        tileEl(b).classList.add("wrong");
        els.feedback.textContent = "Try again";
        setTimeout(() => {
          tileEl(a).classList.remove("flipped", "wrong");
          tileEl(b).classList.remove("flipped", "wrong");
          tileEl(a).setAttribute("aria-label", "Hidden emotion card");
          tileEl(b).setAttribute("aria-label", "Hidden emotion card");
          state.flipped = [];
          state.locked = false;
          els.feedback.textContent = "";
        }, 700);
      }
    }

    function onLevelComplete() {
      if (state.levelIndex < LEVELS.length - 1) {
        renderIntro(state.levelIndex + 1);
      } else {
        audio.done();
        els.winStars.textContent = "★★★";
        els.winMessage.textContent = `You found all ${TOTAL_STARS} matching pairs!`;
        showScreen("win");
      }
    }

    function beginLevel() {
      audio.unlock();
      buildBoard();
      showScreen("play");
    }

    function startGame() {
      audio.unlock();
      state.score = 0;
      state.levelIndex = 0;
      updateScore();
      renderIntro(0);
    }

    els.startBtn.addEventListener("click", startGame);
    els.beginBtn.addEventListener("click", beginLevel);
    els.againBtn.addEventListener("click", startGame);
    els.soundBtn.addEventListener("click", () => {
      audio.unlock();
      audio.setMuted(state.soundOn);
    });
  </script>
</body>
</html>
